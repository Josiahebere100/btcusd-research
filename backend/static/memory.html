<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory · BTC/USD Research</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #0a0a0c; color: #d7d7dd;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px; min-height: 100vh;
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; border-bottom: 1px solid #1a1a20; background: #0d0d10;
      position: sticky; top: 0; z-index: 10;
    }
    .title { color: #e8e8ee; font-weight: 600; letter-spacing: 0.5px; }
    .dot { color: #4a4a55; margin: 0 8px; }
    .sub { color: #6f6f7a; }
    .tabs { display: flex; gap: 6px; padding: 12px 20px;
      border-bottom: 1px solid #14141a; background: #0d0d10; }
    .tab {
      padding: 6px 14px; border: 1px solid #26262e; background: #14141a;
      color: #6f6f7a; border-radius: 3px; cursor: pointer;
      font-family: inherit; font-size: 12px; letter-spacing: 0.4px;
    }
    .tab.on { background: #1b2a44; color: #cfe0ff; border-color: #2e4b7a; }
    .wrap { padding: 20px; max-width: 1800px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left; padding: 6px 10px; border-bottom: 1px solid #16161c;
      font-size: 12px; vertical-align: top;
    }
    th {
      color: #6f6f7a; font-weight: 500; text-transform: uppercase;
      font-size: 10px; letter-spacing: 1px;
      position: sticky; top: 90px; background: #0a0a0c;
    }
    tr:hover td { background: #101015; }
    .sig {
      font-size: 11px; color: #b0b0bb; word-break: break-all;
      max-width: 900px;
    }
    .num { font-variant-numeric: tabular-nums; text-align: right; }
    .up { color: #7fffb0; font-weight: 600; }
    .down { color: #ff9090; font-weight: 600; }
    .correct { color: #7fffb0; }
    .incorrect { color: #ff9090; }
    .pending { color: #8a8a95; }
    .hint { color: #4a4a55; font-size: 11px; padding: 8px 0; }
    .selector {
      margin: 12px 0; display: flex; align-items: center; gap: 8px;
    }
    select, button.act {
      background: #14141a; color: #d7d7dd;
      border: 1px solid #26262e; padding: 6px 10px;
      font-family: inherit; font-size: 12px; border-radius: 3px;
      cursor: pointer;
    }
    button.act { background: #1b2a44; color: #cfe0ff; border-color: #2e4b7a; }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <span class="title">MEMORY</span>
      <span class="dot">·</span>
      <span class="sub">patterns · combinations · engine stats · by engine</span>
    </div>
    <div class="sub" id="updated">—</div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="patterns">PATTERNS</button>
    <button class="tab" data-tab="combinations">COMBINATIONS</button>
    <button class="tab" data-tab="engines">ENGINE STATS</button>
    <button class="tab" data-tab="by-engine">BY ENGINE</button>
  </div>

  <div class="wrap">
    <div id="hint" class="hint"></div>
    <div id="engine-selector" class="selector" style="display:none;">
      <label style="color:#8a8a95; font-size:12px;">Engine:</label>
            <select id="engine-picker">
        <option value="crt">crt</option>
        <option value="labouchere">labouchere</option>
        <option value="trig_euler">trig_euler</option>
        <option value="entropy_regime">entropy_regime</option>
        <option value="superformula">superformula</option>
        <option value="navier_stokes">navier_stokes</option>
        <option value="candlestick">candlestick</option>
        <option value="momentum">momentum</option>
        <option value="trail_tracer">trail_tracer</option>
        <option value="meta_ensemble">meta_ensemble</option>
        <option value="curve_geometry">curve_geometry</option>
      </select>
      <label style="color:#8a8a95; font-size:12px; margin-left:12px;">Show:</label>
      <select id="mode-picker">
        <option value="fired">only fired</option>
        <option value="all">all observations</option>
      </select>
      <button class="act" id="engine-refresh">refresh</button>
    </div>
    <div id="table-wrap"></div>
  </div>

<script>
const API_KEY_STORAGE = "btcusd_memory_api_key";
const POLL_MS = 15000;
let apiKey = getKey();
let currentTab = "patterns";

function getKey() {
  const url = new URL(location.href);
  const k = url.searchParams.get("key");
  if (k) {
    sessionStorage.setItem(API_KEY_STORAGE, k);
    url.searchParams.delete("key");
    history.replaceState({}, "", url.toString());
    return k;
  }
  let s = sessionStorage.getItem(API_KEY_STORAGE);
  if (!s) {
    s = window.prompt("Enter your COLLECTOR_API_KEY:");
    if (s) sessionStorage.setItem(API_KEY_STORAGE, s.trim());
  }
  return (s || "").trim();
}

function fmtPct(v) {
  if (v === null || v === undefined) return "—";
  return (v * 100).toFixed(1) + "%";
}

function fmtTime(iso) {
  if (!iso) return "—";
  return iso.slice(11, 19);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

async function loadTab() {
  const hints = {
    patterns: "Signatures learned by each engine. Prefix identifies engine (crt:, lab:, trig:, ent:, sf:, ns:, cs:).",
    combinations: "Full supersignatures across all engines. Pipe-joined state.",
    engines: "Per-engine directional calls and outcomes over the window.",
    "by-engine": "Full supersignatures where one engine contributed. Dir is the combined direction; Signature is the full JSON.",
  };
  document.getElementById("hint").textContent = hints[currentTab] || "";

  const engine = (document.getElementById("engine-picker") || {}).value || "crt";
  const mode = (document.getElementById("mode-picker") || {}).value || "fired";
  const onlyFired = mode === "fired";

  const endpoints = {
    patterns: "/api/memory/patterns?limit=300&min_occurrences=1",
    combinations: "/api/memory/combinations?limit=300&min_occurrences=1",
    engines: "/api/memory/engine-stats?hours=168",
    "by-engine": "/api/memory/by-engine?engine=" + encodeURIComponent(engine)
      + "&hours=168&limit=300&only_fired=" + (onlyFired ? "true" : "false"),
  };

  try {
    const res = await fetch(endpoints[currentTab], {
      headers: { authorization: "Bearer " + apiKey }
    });
    if (res.status === 401) {
      sessionStorage.removeItem(API_KEY_STORAGE);
      apiKey = getKey();
      return;
    }
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (parseErr) {
      document.getElementById("table-wrap").innerHTML =
        "<div style='color:#ff9090'>HTTP " + res.status + ": " +
        esc(text.slice(0, 300)) + "</div>";
      return;
    }
    if (currentTab === "by-engine") {
      renderByEngine(data);
    } else {
      render(data);
    }
    document.getElementById("updated").textContent =
      "updated " + new Date().toTimeString().slice(0, 8);
  } catch (e) {
    document.getElementById("table-wrap").innerHTML =
      "<div style='color:#ff9090'>error: " + esc(e.message) + "</div>";
  }
}

function render(data) {
  const wrap = document.getElementById("table-wrap");
  if (currentTab === "patterns") {
    const rows = data.patterns || [];
    let html = "<table><thead><tr>" +
      "<th>Signature</th><th class='num'>Occ</th><th class='num'>Corr</th>" +
      "<th class='num'>Incorr</th><th class='num'>Acc</th>" +
      "<th class='num'>Recent</th><th class='num'>Last seen</th>" +
      "</tr></thead><tbody>";
    for (const p of rows) {
      const accCls = p.accuracy == null ? "" :
        p.accuracy >= 0.55 ? "correct" :
        p.accuracy <= 0.45 ? "incorrect" : "";
      const rAccCls = p.recent_accuracy == null ? "" :
        p.recent_accuracy >= 0.55 ? "correct" :
        p.recent_accuracy <= 0.45 ? "incorrect" : "";
      html += "<tr>" +
        "<td class='sig' title='" + esc(p.signature) + "'>" + esc(p.signature) + "</td>" +
        "<td class='num'>" + p.occurrences + "</td>" +
        "<td class='num correct'>" + p.correct + "</td>" +
        "<td class='num incorrect'>" + p.incorrect + "</td>" +
        "<td class='num " + accCls + "'>" + fmtPct(p.accuracy) + "</td>" +
        "<td class='num " + rAccCls + "'>" + fmtPct(p.recent_accuracy) + "</td>" +
        "<td class='num'>" + fmtTime(p.last_seen) + "</td>" +
        "</tr>";
    }
    html += "</tbody></table>";
    wrap.innerHTML = html;
  } else if (currentTab === "combinations") {
    const rows = data.combinations || [];
    let html = "<table><thead><tr>" +
      "<th>Supersignature</th><th class='num'>Occ</th><th class='num'>Corr</th>" +
      "<th class='num'>Incorr</th><th class='num'>Acc</th>" +
      "<th class='num'>Recent</th><th>Output</th>" +
      "</tr></thead><tbody>";
    for (const c of rows) {
      const accCls = c.accuracy == null ? "" :
        c.accuracy >= 0.55 ? "correct" :
        c.accuracy <= 0.45 ? "incorrect" : "";
      const rAccCls = c.recent_accuracy == null ? "" :
        c.recent_accuracy >= 0.55 ? "correct" :
        c.recent_accuracy <= 0.45 ? "incorrect" : "";
      const outCls = c.combined_output === "UP" ? "up" :
        c.combined_output === "DOWN" ? "down" : "pending";
      html += "<tr>" +
        "<td class='sig' title='" + esc(c.combination) + "'>" + esc(c.combination) + "</td>" +
        "<td class='num'>" + c.occurrences + "</td>" +
        "<td class='num correct'>" + c.correct + "</td>" +
        "<td class='num incorrect'>" + c.incorrect + "</td>" +
        "<td class='num " + accCls + "'>" + fmtPct(c.accuracy) + "</td>" +
        "<td class='num " + rAccCls + "'>" + fmtPct(c.recent_accuracy) + "</td>" +
        "<td class='" + outCls + "'>" + esc(c.combined_output) + "</td>" +
        "</tr>";
    }
    html += "</tbody></table>";
    wrap.innerHTML = html;
  } else {
    const rows = data.engines || [];
    let html = "<table><thead><tr>" +
      "<th>Engine</th><th class='num'>Signals</th>" +
      "<th class='num'>UP</th><th class='num'>DOWN</th>" +
      "<th class='num'>Correct</th><th class='num'>Incorrect</th>" +
      "<th class='num'>Accuracy</th>" +
      "</tr></thead><tbody>";
    for (const e of rows) {
      const accCls = e.accuracy == null ? "" :
        e.accuracy >= 0.55 ? "correct" :
        e.accuracy <= 0.45 ? "incorrect" : "";
      html += "<tr>" +
        "<td>" + esc(e.engine) + "</td>" +
        "<td class='num'>" + e.total + "</td>" +
        "<td class='num up'>" + e.up_calls + "</td>" +
        "<td class='num down'>" + e.down_calls + "</td>" +
        "<td class='num correct'>" + e.correct + "</td>" +
        "<td class='num incorrect'>" + e.incorrect + "</td>" +
        "<td class='num " + accCls + "'>" + fmtPct(e.accuracy) + "</td>" +
        "</tr>";
    }
    html += "</tbody></table>";
    wrap.innerHTML = html;
  }
}

function renderByEngine(data) {
  const wrap = document.getElementById("table-wrap");
  const rows = data.signals || [];
  if (rows.length === 0) {
    wrap.innerHTML = "<div class='hint'>No rows in this window. " +
      "If 'only fired' is selected, this engine hasn't made directional " +
      "calls yet — switch to 'all observations' to see them anyway.</div>";
    return;
  }
  let html = "<table><thead><tr>" +
    "<th style='width:80px'>Time</th>" +
    "<th style='width:70px'>Dir</th>" +
    "<th style='width:100px'>Result</th>" +
    "<th>Signature</th>" +
    "</tr></thead><tbody>";
  for (const s of rows) {
    const dirCls = s.direction === "UP" ? "up" :
      s.direction === "DOWN" ? "down" : "pending";
    let result = "—";
    let rCls = "pending";
    if (s.correct === true) { result = "✓ correct"; rCls = "correct"; }
    else if (s.correct === false) { result = "✗ incorrect"; rCls = "incorrect"; }
    else if (s.direction === "NO_SIGNAL") { result = "no signal"; rCls = "pending"; }
    else { result = "pending"; rCls = "pending"; }
    html += "<tr>" +
      "<td class='num'>" + fmtTime(s.at) + "</td>" +
      "<td class='" + dirCls + "'>" + esc(s.direction) + "</td>" +
      "<td class='" + rCls + "'>" + esc(result) + "</td>" +
      "<td class='sig'>" + esc(s.signature) + "</td>" +
      "</tr>";
  }
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    currentTab = t.dataset.tab;
    document.getElementById("engine-selector").style.display =
      currentTab === "by-engine" ? "flex" : "none";
    loadTab();
  });
});

document.getElementById("engine-refresh").addEventListener("click", () => loadTab());

loadTab();
setInterval(loadTab, POLL_MS);
</script>
</body>
</html>
